<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>火影自动运行追踪 · 新格式预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f1420;color:#e6edf3;font:14px/1.5 -apple-system,"Microsoft YaHei",sans-serif}
header{padding:12px 16px;background:#16213e;border-bottom:1px solid #2a3a5a;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:16px;margin:0}header small{color:#7f8c8d}#pos{margin-left:auto;color:#7f8c8d}
#wrap{display:flex;gap:12px;padding:12px;height:calc(100vh - 56px)}
#left{flex:0 0 480px;display:flex;flex-direction:column;gap:10px}
#frame{background:#000;border:1px solid #2a3a5a;border-radius:8px;overflow:hidden}
#frame img{width:100%;display:block}
#ctrls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button{background:#e94560;color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
button.sec{background:#2a3a5a}
input{background:#1a2336;color:#e6edf3;border:1px solid #2a3a5a;border-radius:5px;padding:5px;width:80px}
#info{background:#16213e;border:1px solid #2a3a5a;border-radius:8px;padding:10px 12px;font-size:13px}
#info .row{display:flex;gap:8px;margin:3px 0}.row b{flex:0 0 84px;color:#7f8c8d;font-weight:600}
#hits{margin-top:6px}#hits span{display:inline-block;background:#10331f;color:#2ecc71;border:1px solid #1d5c39;border-radius:10px;padding:1px 8px;font-size:11px;margin:2px}
#list{flex:1;overflow:auto;background:#11182a;border:1px solid #2a3a5a;border-radius:8px;padding:6px}
#list .it{padding:5px 8px;border-bottom:1px solid #1c2740;cursor:pointer;font-size:12px;display:flex;gap:8px;align-items:center}
#list .it:hover{background:#1a2742}#list .it.cur{background:#3a2a1a}
#list .it .k{color:#e94560;flex:0 0 52px}#list .it .t{color:#7f8c8d;flex:0 0 56px}#list .it .lb{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kind-key{color:#3498db}.kind-swipe{color:#9b59b6}.kind-hold{color:#e67e22}.kind-release{color:#95a5a6}.kind-tap{color:#e6edf3}
.kind-decide{color:#f1c40f}.kind-note{color:#7f8c8d}.kind-phase{color:#2ecc71}
#decide{margin-top:8px;background:#2a2410;border:1px solid #5c4a1d;border-radius:6px;padding:8px 10px;font-size:12px}
#decide .d{display:flex;gap:8px;margin:2px 0}#decide .d b{flex:0 0 92px;color:#c9a227;font-weight:600}
#decide .v-hit{color:#2ecc71;font-weight:700}#decide .v-miss{color:#e94560;font-weight:700}#decide .v-skip{color:#95a5a6}
#decide h4{margin:0 0 6px;font-size:12px;color:#f1c40f}
#list .it.ph{background:#12261a;border-top:1px solid #1d5c39;font-weight:700;color:#2ecc71}
#list .it.dec{background:#231d0c}
#list .it .ph-tag{flex:0 0 auto;color:#2ecc71;font-size:11px}
</style></head><body>
<header><h1>🔬 火影自动运行追踪 <small>v0.5.95 · 29 步 · 新格式预览</small></h1>
<span id="pos"></span></header>
<div id="wrap"><div id="left">
<div id="frame"><img id="img" alt="帧"></div>

<button id="play" class="sec">▶ 自动播放</button><span>跳到</span>
<input id="jump" type="number" min="1" value="1"><button id="go" class="sec">前往</button></div>
<div id="info"></div></div>
<div id="list"></div></div>

.7，阈值 55） → 交给连点兜底","coord":null,"key":null,"hold":0,"scene":"battle","brightness":70,"probeHits":[],"frame":null,"phase":"秘境 第1场/结算"},{"seq":24,"t":46000,"kind":"decide","label":"settleBack@turbo → hit","coord":[128,668],"key":null,"hold":0,"scene":"battle","brightness":70,"probeHits":[],"frame":null,"phase":"秘境 第1场/结算","decide":{"score":27.4,"thresh":55,"at":[128,668],"elapsedS":15,"verdict":"hit"}},{"seq":25,"t":46000,"kind":"note","label":"🔔 连点期间探到结算（score=27.4，+15s）→ 立即停手","coord":null,"key":null,"hold":0,"scene":"battle","brightness":70,"probeHits":[],"frame":null,"phase":"秘境 第1场/结算"},{"seq":26,"t":47000,"kind":"tap","label":"","coord":[638,604],"key":null,"hold":0,"scene":"battle","brightness":70,"probeHits":[],"frame":null,"phase":"秘境 第1场/结算"},{"seq":27,"t":47500,"kind":"decide","label":"clearSettlement → skip-not-settle","coord":null,"key":null,"hold":0,"scene":"other","brightness":70,"probeHits":[],"frame":null,"phase":"秘境 第1场/结算","decide":{"scene":"other","round":1,"verdict":"skip-not-settle","why":"场景非结算页 → 不盲点"}},{"seq":28,"t":48000,"kind":"note","label":"⚠ 场景=other 非结算页 → 不盲点（防误点）","coord":null,"key":null,"hold":0,"scene":"other","brightness":70,"probeHits":[],"frame":null,"phase":"秘境 第1场/结算"},{"seq":29,"t":52000,"kind":"tap","label":"","coord":[129,671],"key":null,"hold":0,"scene":"other","brightness":70,"probeHits":[{"name":"backBtnX","dist":4}],"frame":null,"phase":"秘境 第1场/结算"}];
var i=0,timer=null;
var $=function(id){return document.getElementById(id)};
function fmt(ms){var s=ms/1000;return (s<60?s.toFixed(1)+"s":Math.floor(s/60)+"m"+((s%60)|0)+"s")}
function render(){var s=STEPS[i];if(!s)return;
$("img").src=s.frame||"";$("img").alt=s.frame?"点击时画面":"（无帧图）";
var c=s.coord?(s.coord.length===4?s.coord.slice(0,2).join(",")+" → "+s.coord.slice(2).join(","):s.coord.join(",")):"—";
var extra=(s.kind==="key")?("键: "+s.key+(s.hold?(" 按"+s.hold+"ms"):"")):("坐标: "+c);
var hits=(s.probeHits||[]).map(function(h){return "<span>"+h.name+" d="+h.dist+"</span>"}).join("");
var dv=s.decide;var dh="";
if(dv){var rows="";for(var k in dv){var v=dv[k];
var cls=(k==="verdict")?("v-"+String(v).replace(/[^a-z]/gi,"")):"";
rows+="<div class=d><b>"+k+"</b><span class=\""+cls+"\">"+(typeof v==="object"?JSON.stringify(v):v)+"</span></div>"}
dh="<div id=decide><h4>🎯 判定详情</h4>"+rows+"</div>"}
$("info").innerHTML="<div class=row><b>步骤</b><span>#"+s.seq+" / "+STEPS.length+"</span></div>"+
(s.phase?"<div class=row><b>阶段</b><span class=kind-phase>"+s.phase+"</span></div>":"")+
"<div class=row><b>时间</b><span>"+fmt(s.t)+"</span></div>"+
"<div class=row><b>类型</b><span class=kind-"+s.kind+">"+s.kind+"</span></div>"+
"<div class=row><b>说明</b><span>"+(s.label||"—")+"</span></div>"+
"<div class=row><b>动作</b><span>"+extra+"</span></div>"+
"<div class=row><b>场景</b><span>"+(s.scene||"—")+" / 亮度 "+(s.brightness>=0?s.brightness.toFixed(1):"-")+"</span></div>"+
dh+
"<div class=row><b>命中探针</b></div><div id=hits>"+(hits||"<span style=\"background:#331;color:#a55\">无</span>")+"</div>";
$("pos").textContent="第 "+(i+1)+" / "+STEPS.length+" 步";
var its=document.querySelectorAll("#list .it");for(var k=0;k<its.length;k++){its[k].className="it"+(k===i?" cur":"")}
if(its[i])its[i].scrollIntoView({block:"nearest"})}
function go(n){i=Math.max(0,Math.min(STEPS.length-1,n));render()}
$("prev").onclick=function(){go(i-1)};$("next").onclick=function(){go(i+1)};
$("go").onclick=function(){go((parseInt($("jump").value,10)||1)-1)};
$("play").onclick=function(){if(timer){clearInterval(timer);timer=null;this.textContent="▶ 自动播放";return}this.textContent="⏸ 暂停";timer=setInterval(function(){if(i>=STEPS.length-1){clearInterval(timer);timer=null;$("play").textContent="▶ 自动播放";return}go(i+1)},900)};
var listHtml="";for(var j=0;j<STEPS.length;j++){var s=STEPS[j];var lb=(s.label||s.kind);
var cls="it"+(s.kind==="phase"?" ph":(s.kind==="decide"?" dec":""));
var tag=s.phase?"<span class=ph-tag>"+s.phase.split("/").pop()+"</span>":"";
listHtml+="<div class=\""+cls+"\" data-i="+j+"><span class=k>"+s.kind+"</span><span class=t>"+fmt(s.t)+"</span><span class=lb>"+(lb||"")+"</span>"+tag+"</div>"}
$("list").innerHTML=listHtml;
$("list").onclick=function(e){var d=e.target.closest(".it");if(d)go(parseInt(d.getAttribute("data-i"),10))};
render();
</script></body></html>
